<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="form-container">

    <h1>Edit Student</h1>

    <form method="POST">

        <label>Name</label>
        <input
            type="text"
            name="name"
            value="{{ student['name'] }}"
            required
        >

        <label>Roll Number</label>
        <input
            type="text"
            name="roll_no"
            value="{{ student['roll_no'] }}"
            required
        >

        <label>Department</label>
        <select name="department" required>

            <option value="CSE"
                {% if student['department'] == 'CSE' %}
                selected
                {% endif %}>
                CSE
            </option>

            <option value="IT"
                {% if student['department'] == 'IT' %}
                selected
                {% endif %}>
                IT
            </option>

            <option value="ECE"
                {% if student['department'] == 'ECE' %}
                selected
                {% endif %}>
                ECE
            </option>

            <option value="EEE"
                {% if student['department'] == 'EEE' %}
                selected
                {% endif %}>
                EEE
            </option>

            <option value="MECH"
                {% if student['department'] == 'MECH' %}
                selected
                {% endif %}>
                MECH
            </option>

            <option value="CIVIL"
                {% if student['department'] == 'CIVIL' %}
                selected
                {% endif %}>
                CIVIL
            </option>

        </select>

        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{ student['email'] }}"
            required
        >

        <label>Phone</label>
        <input
            type="text"
            name="phone"
            value="{{ student['phone'] }}"
            required
        >

        <button type="submit" class="btn add-btn">
            Update Student
        </button>

        <a href="{{ url_for('index') }}"
           class="btn reset-btn">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
